name: 蛛網策略台股當沖選股

on:
  schedule:
    # 台灣時間週一至週五 15:35 執行 (UTC 07:35)
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-selector:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行盤後選股並發送 Telegram 推播
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from auto_daytrade_tg import run_daily_selection; run_daily_selection()"
